[package]
name = "plotx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Command-line inspection, processing, and export tool for PlotX."

[[bin]]
name = "plotx-cli"
path = "src/main.rs"

[features]
# Default builds use the reference executor. This feature is retained as an
# explicit maintenance switch for the dormant DataFusion backend.
default = []
datafusion = ["plotx-core/datafusion"]

[dependencies]
plotx-core.workspace = true
serde_json.workspace = true
